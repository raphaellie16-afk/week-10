<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang Belanja — Garasi Helm Custom</title>
    <style>
      :root {
        --bg-canvas: #f5f6f8;
        --bg-surface: #ffffff;
        --bg-studio: #e9ecf1;
        --bg-subtle: #eef1f5;
        --ink-primary: #111317;
        --ink-secondary: #434b57;
        --ink-muted: #5d6675;
        --accent-cobalt: #1d4ed8;
        --accent-cobalt-hover: #1e40af;
        --danger-red: #dc2626;
        --border-hairline: #dce1e8;
        --border-strong: #c6cdd8;
        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        --font-mono: "SFMono-Regular", Consolas, monospace;
        --radius-sm: 6px;
        --radius-md: 10px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background-color: var(--bg-canvas);
        color: var(--ink-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
      a { color: inherit; text-decoration: none; }
      .tabular { font-variant-numeric: tabular-nums; }
      .container {
        max-width: 1100px;
        margin-inline: auto;
        padding-inline: 24px;
      }

      /* HEADER */
      .site-header {
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-hairline);
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 68px;
      }
      .brand-wordmark {
        font-size: 1.0625rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .back-link {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--accent-cobalt);
      }
      .back-link:hover { text-decoration: underline; }

      /* MAIN LAYOUT */
      .cart-page { padding-block: 48px 72px; }
      .page-title {
        margin: 0 0 6px;
        font-size: 1.75rem;
        font-weight: 700;
      }
      .page-subtitle {
        margin: 0 0 32px;
        font-size: 0.9375rem;
        color: var(--ink-secondary);
      }
      .cart-layout {
        display: grid;
        grid-template-columns: 1.45fr 0.85fr;
        gap: 32px;
        align-items: start;
      }

      /* ITEM LIST */
      .panel-box {
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-md);
        padding: 24px;
      }
      .cart-item {
        display: grid;
        grid-template-columns: 88px 1fr auto;
        gap: 18px;
        align-items: center;
        padding-block: 18px;
        border-bottom: 1px solid var(--border-hairline);
      }
      .cart-item:first-child { padding-top: 0; }
      .cart-item:last-child { border-bottom: none; padding-bottom: 0; }
      .item-thumb {
        width: 88px;
        height: 88px;
        object-fit: cover;
        background: var(--bg-studio);
        border: 1px solid var(--border-hairline);
        border-radius: var(--radius-sm);
      }
      .item-title {
        margin: 0 0 4px;
        font-size: 1rem;
        font-weight: 600;
      }
      .item-meta {
        font-size: 0.8125rem;
        color: var(--ink-muted);
      }
      .item-unit-price {
        margin-top: 6px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--ink-secondary);
      }
      .item-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }
      .item-subtotal {
        font-size: 1rem;
        font-weight: 700;
      }
      .qty-stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .qty-btn {
        width: 30px;
        height: 28px;
        font-weight: 700;
        background: var(--bg-subtle);
        border: none;
        cursor: pointer;
      }
      .qty-btn:hover { background: var(--border-hairline); }
      .qty-val {
        min-width: 34px;
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .remove-btn {
        font-size: 0.75rem;
        color: var(--danger-red);
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }
      .remove-btn:hover { text-decoration: underline; }

      /* SUMMARY */
      .summary-title {
        margin: 0 0 16px;
        font-size: 1.125rem;
        font-weight: 700;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.875rem;
        color: var(--ink-secondary);
      }
      .summary-total {
        display: flex;
        justify-content: space-between;
        padding-top: 14px;
        margin-top: 14px;
        margin-bottom: 20px;
        border-top: 1px solid var(--border-strong);
        font-size: 1.0625rem;
        font-weight: 700;
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 12px 18px;
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
        color: #fff;
        background: var(--accent-cobalt);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .btn-primary:hover:not(:disabled) { background: var(--accent-cobalt-hover); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-outline {
        display: block;
        width: 100%;
        margin-top: 10px;
        padding: 9px;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--ink-secondary);
        background: transparent;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }
      .btn-outline:hover {
        color: var(--danger-red);
        border-color: var(--danger-red);
      }
      .empty-box {
        text-align: center;
        padding: 48px 20px;
        color: var(--ink-secondary);
      }

      @media (max-width: 820px) {
        .cart-layout { grid-template-columns: 1fr; }
        .cart-item { grid-template-columns: 72px 1fr; }
        .item-right {
          grid-column: 2;
          flex-direction: row;
          justify-content: space-between;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand-wordmark">GARASI HELM CUSTOM</a>
        <a href="index.html" class="back-link">← Kembali ke Katalog (100 Unit)</a>
      </div>
    </header>

    <main class="cart-page">
      <div class="container">
        <h1 class="page-title">Keranjang Pemesanan</h1>
        <p class="page-subtitle">Periksa kembali unit helm, ukuran cangkang, dan jumlah pesanan sebelum melanjutkan.</p>

        <div class="cart-layout">
          <div id="cart-items-container" class="panel-box"></div>

          <aside class="panel-box">
            <h2 class="summary-title">Ringkasan Pesanan</h2>
            <div class="summary-row">
              <span>Total Unit</span>
              <span id="summary-qty" class="tabular">0 Unit</span>
            </div>
            <div class="summary-row">
              <span>Tas Pelindung Helm</span>
              <span>Gratis</span>
            </div>
            <div class="summary-total">
              <span>Total Pembayaran</span>
              <span id="summary-price" class="tabular">Rp 0</span>
            </div>
            <button type="button" id="checkout-btn" class="btn-primary" disabled>Konfirmasi Pesanan</button>
            <button type="button" id="clear-btn" class="btn-outline" style="display: none;">Kosongkan Keranjang</button>
          </aside>
        </div>
      </div>
    </main>

    <script>
      const CART_STORAGE_KEY = "garasi_helm_custom_cart_v1";
      const formatRupiah = (angka) => "Rp " + angka.toLocaleString("id-ID");

      function handleImgError(imgEl, num) {
        const fallbackExts = ["jpeg", "png", "webp", "JPG"];
        const step = Number(imgEl.dataset.retry || 0);
        if (step < fallbackExts.length) {
          imgEl.dataset.retry = String(step + 1);
          imgEl.src = `gambar/${num}.${fallbackExts[step]}`;
        } else {
          imgEl.onerror = null;
        }
      }

      let cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || "[]");

      const itemsContainer = document.getElementById("cart-items-container");
      const summaryQty = document.getElementById("summary-qty");
      const summaryPrice = document.getElementById("summary-price");
      const checkoutBtn = document.getElementById("checkout-btn");
      const clearBtn = document.getElementById("clear-btn");

      function saveAndRender() {
        localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
        renderPage();
      }

      function renderPage() {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        const totalPrice = cart.reduce((sum, item) => sum + item.priceNum * item.qty, 0);

        summaryQty.textContent = `${totalQty} Unit`;
        summaryPrice.textContent = formatRupiah(totalPrice);
        checkoutBtn.disabled = cart.length === 0;
        clearBtn.style.display = cart.length > 0 ? "block" : "none";

        if (cart.length === 0) {
          itemsContainer.innerHTML = `
            <div class="empty-box">
              <p>Keranjang belanja masih kosong.</p>
              <a href="index.html" class="btn-primary" style="max-width: 240px; margin: 16px auto 0;">Pilih Helm di Katalog</a>
            </div>
          `;
          return;
        }

        itemsContainer.innerHTML = cart
          .map(
            (item) => `
            <div class="cart-item">
              <img src="gambar/${item.num}.jpg" alt="${item.title}" class="item-thumb" onerror="handleImgError(this, ${item.num})" />
              <div>
                <h3 class="item-title">${item.title}</h3>
                <div class="item-meta">SKU: ${item.sku} · Ukuran: <strong>${item.size}</strong></div>
                <div class="item-unit-price tabular">${formatRupiah(item.priceNum)} / unit</div>
              </div>
              <div class="item-right">
                <span class="item-subtotal tabular">${formatRupiah(item.priceNum * item.qty)}</span>
                <div class="qty-stepper">
                  <button type="button" class="qty-btn" data-minus="${item.key}">−</button>
                  <span class="qty-val tabular">${item.qty}</span>
                  <button type="button" class="qty-btn" data-plus="${item.key}">+</button>
                </div>
                <button type="button" class="remove-btn" data-remove="${item.key}">Hapus</button>
              </div>
            </div>
          `
          )
          .join("");
      }

      itemsContainer.addEventListener("click", (e) => {
        const minusKey = e.target.dataset.minus;
        const plusKey = e.target.dataset.plus;
        const removeKey = e.target.dataset.remove;

        if (minusKey) {
          const idx = cart.findIndex((i) => i.key === minusKey);
          if (idx > -1) {
            cart[idx].qty -= 1;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            saveAndRender();
          }
        } else if (plusKey) {
          const idx = cart.findIndex((i) => i.key === plusKey);
          if (idx > -1) {
            cart[idx].qty += 1;
            saveAndRender();
          }
        } else if (removeKey) {
          cart = cart.filter((i) => i.key !== removeKey);
          saveAndRender();
        }
      });

      clearBtn.addEventListener("click", () => {
        cart = [];
        saveAndRender();
      });

      checkoutBtn.addEventListener("click", () => {
        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        const totalPrice = cart.reduce((sum, item) => sum + item.priceNum * item.qty, 0);
        alert(`Pesanan ${totalQty} unit (${formatRupiah(totalPrice)}) berhasil dikonfirmasi!`);
        cart = [];
        saveAndRender();
      });

      // Sinkron otomatis jika tab index.html mengubah keranjang
      window.addEventListener("storage", (e) => {
        if (e.key === CART_STORAGE_KEY) {
          cart = JSON.parse(e.newValue || "[]");
          renderPage();
        }
      });

      renderPage();
    </script>
  </body>
</html>
