<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Approve Simulator</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --green: #16a34a;
      --green-hover: #15803d;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --green-bg: #f0fdf4;
      --amber: #b45309;
      --amber-bg: #fffbeb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem 1rem 3rem;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
    }

    .head h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .head p {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .live-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
      background-color: var(--green-bg);
      border: 1px solid #bbf7d0;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--green);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 1.25rem 0 0.6rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .tx-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .tx-card.highlight {
      border-color: #18181b;
      box-shadow: 0 0 0 1px #18181b;
    }

    .tx-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .tx-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .tx-amount {
      font-size: 0.98rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    .tx-actions {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-approve {
      background-color: var(--green);
      color: #ffffff;
    }

    .btn-approve:hover {
      background-color: var(--green-hover);
    }

    .btn-reject {
      background-color: transparent;
      border-color: #fecaca;
      color: var(--red);
    }

    .btn-reject:hover {
      background-color: var(--red-bg);
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .tag-paid {
      background-color: var(--green-bg);
      color: var(--green);
      border: 1px solid #bbf7d0;
    }

    .tag-rejected {
      background-color: var(--red-bg);
      color: var(--red);
      border: 1px solid #fecaca;
    }

    .empty {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 1.5rem 1rem;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .log {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div>
        <h1>QRIS Payment Simulator</h1>
        <p>Approve atau tolak transaksi QRIS Garasi Helm Custom secara realtime</p>
      </div>
      <span class="live-pill"><span class="dot"></span> LIVE SYNC</span>
    </header>

    <div id="sim-root"></div>
    <div id="sim-log" class="log"></div>
  </div>

  <script src="qris-approve.js"></script>
</body>
</html>
